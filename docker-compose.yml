services:
  xray:
    build: .
    container_name: marzneshin-xray
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - /var/lib/marzneshin:/var/lib/marzneshin
      - /root/vpn-credentials:/root/vpn-credentials
    logging:
      driver: "none"

  nginx:
    build: ./docker/nginx
    container_name: marzneshin-nginx
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    depends_on:
      - xray
    volumes:
      - /var/lib/marzneshin:/var/lib/marzneshin
    logging:
      driver: "none"
