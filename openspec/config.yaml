schema: spec-driven

context: |
  Follow all mandatory constraints in AGENTS.md:
  - Never modify the local workstation VPN (/etc/sing-box/config.json) or run active pings/probes/speedtests.
  - Zero-Emission on the Russian Cascade Bridge (mos): domainStrategy AsIs, zero DNS, zero freedom outbound, no outbound internet requests.
  - Zero-Surface SSH CLI only: no web panels, no /sub/ endpoints, no access/error logs, no secrets/live IPs in Git.
  - Hard security invariants (never regress): Xray v26.6.27, nginx >= 1.30.7-alpine (CVE-2026-123007), uTLS fp=firefox, MPTCP disabled (sysctl + tcpMptcp: false), bilateral TCPMSS=1360, CN=localhost + 444 on unknown/missing SNI, no urltest.
  - Unconditional blocking across ALL contours (zero relaxations for voice/video calls): UDP 443/3478/19302 (QUIC/STUN/WebRTC), BitTorrent, ::/0, geolocation/Firebase telemetry; keep gvt1.com/gvt2.com allowed.
  - Strict AI isolation: exit-ai serves max 1 ai-owner user on an independent root domain with zero WARP/Tor/IP flapping; media-consumer users (~20 mobile Android/iOS devices) use vanilla sing-box >= 1.14 Media-Selective profiles on separate media exits.
