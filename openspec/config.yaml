schema: spec-driven

context: |
  Follow all mandatory constraints in AGENTS.md:
  - Never modify the local workstation VPN (/etc/sing-box/config.json) or run active pings/probes/speedtests.
  - Zero-Emission on the Russian Cascade Bridge (mos): domainStrategy AsIs, zero DNS, zero freedom outbound, no outbound internet requests.
  - Zero-Surface SSH CLI only: no web panels, no /sub/ endpoints, no access/error logs, no secrets/live IPs in Git.
  - Hard security invariants (never regress): Xray v26.6.27, nginx >= 1.30.7-alpine (CVE-2026-123007), uTLS fp=firefox, MPTCP disabled (sysctl + tcpMptcp: false), bilateral TCPMSS=1360, CN=localhost + 444 on unknown/missing SNI, no urltest, bounded xmux rotation on mos -> Exit.
  - Unconditional blocking across ALL contours (zero relaxations for voice/video calls): UDP 443/3478/19302 (QUIC/STUN/WebRTC), BitTorrent, ::/0, geolocation/Firebase telemetry, DNS query_type "HTTPS" on all sing-box profiles (full + selective), AND server-side RU egress blackhole on foreign Exit nodes (domain:ru, domain:su, domain:xn--p1ai, geoip:ru -> block, zero WARP); keep gvt1.com/gvt2.com allowed.
  - Strict AI isolation & mandatory next milestone: openspec/changes/multi-exit-bridge-cluster/ is a mandatory prerequisite before scaling past 2 devices — exit-ai serves max 1 ai-owner user on an independent root domain, distinct /24 subnet, and separate ASN/hoster with zero WARP/Tor/IP flapping; media-consumer users (~20 mobile Android/iOS devices) use vanilla sing-box >= 1.14 Media-Selective profiles (never raw vless:// links) on separate media exits.
  - Quarantine discipline: upon TLS handshake drops or TCPSynRetrans/TCPTimeouts spikes in cluster_watch.py, halt client traffic/reconnects to avoid turning a 3-7 day quarantine into a permanent IP ban.
